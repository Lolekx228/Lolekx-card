<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админка Lolekx-card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050505;
      color: #fff;
    }
    .wrap {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 4px;
      font-size: 24px;
    }
    .subtitle {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 18px;
    }
    fieldset {
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px 14px 14px;
      margin-bottom: 14px;
    }
    legend {
      padding: 0 6px;
      font-size: 13px;
      opacity: 0.9;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      opacity: 0.9;
    }
    input[type="text"],
    input[type="url"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .row > .col {
      flex: 1 1 0;
      min-width: 140px;
    }
    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    input[type="color"] {
      width: 60px;
      height: 26px;
      padding: 0;
      border-radius: 4px;
      border: 1px solid #444;
      background: #111;
    }
    .tracks {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .track {
      border-radius: 8px;
      border: 1px solid #333;
      padding: 8px;
      background: #0c0c0c;
    }
    .track-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .track-header span {
      opacity: 0.9;
    }
    .track-header label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      font-size: 12px;
      opacity: 0.8;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid #444;
      background: #161616;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background: #202020;
    }
    button.primary {
      border-color: #c4442e;
      background: #c4442e;
    }
    button.primary:hover {
      background: #d6543c;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.8;
      min-height: 16px;
    }
    .status.ok {
      color: #7fd47f;
    }
    .status.err {
      color: #ff7f7f;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Админка Lolekx-card</h1>
  <div class="subtitle">
    Тут можно настроить ник, описание, локацию, фон, аватар, ссылки и музыку для карточки.
    Все данные сохраняются в localStorage под ключом <code>Lolekx228_profile</code>.
  </div>

  <!-- Профиль -->
  <fieldset>
    <legend>Профиль</legend>
    <label for="displayName">Ник</label>
    <input type="text" id="displayName" placeholder="@Lolekx228">

    <label for="description">Описание</label>
    <textarea id="description" placeholder="Кто ты, что делаешь и т.п."></textarea>

    <label for="location">Локация</label>
    <input type="text" id="location" placeholder="Страна, город">
  </fieldset>

  <!-- Аватар и фон -->
  <fieldset>
    <legend>Аватар и фон</legend>
    <label for="avatarUrl">Ссылка на аватар</label>
    <input type="url" id="avatarUrl" placeholder="https://...">

    <label for="backgroundUrl">Ссылка на фон (BG)</label>
    <input type="url" id="backgroundUrl" placeholder="https://...">
  </fieldset>

  <!-- Цвета и эффекты -->
  <fieldset>
    <legend>Цвета и эффекты</legend>
    <div class="row">
      <div class="col">
        <label for="textColor">Цвет текста</label>
        <input type="color" id="textColor">
      </div>
      <div class="col">
        <label for="accentColor">Цвет подсветки ника</label>
        <input type="color" id="accentColor">
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="gradient1">Градиент 1</label>
        <input type="color" id="gradient1">
      </div>
      <div class="col">
        <label for="gradient2">Градиент 2</label>
        <input type="color" id="gradient2">
      </div>
    </div>

    <div class="checkbox-line">
      <input type="checkbox" id="gradientEnabled">
      <label for="gradientEnabled">Включить градиент (иначе фон — сплошной цвет bgColor)</label>
    </div>

    <div class="row">
      <div class="col">
        <label for="bgColor">Фон карточки (bgColor)</label>
        <input type="color" id="bgColor">
      </div>
      <div class="col">
        <label for="opacity">Прозрачность карточки (0.5–1)</label>
        <input type="text" id="opacity" placeholder="0.9">
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="blur">Blur карточки (px, примерно 0–20)</label>
        <input type="text" id="blur" placeholder="10">
      </div>
    </div>

    <div class="checkbox-line">
      <input type="checkbox" id="monochrome">
      <label for="monochrome">Соц.ссылки чёрно-белые</label>
    </div>

    <div class="checkbox-line">
      <input type="checkbox" id="animatedTitle">
      <label for="animatedTitle">Мерцающий ник (анимация glow)</label>
    </div>
  </fieldset>

  <!-- Соц.сети -->
  <fieldset>
    <legend>Соц.сети</legend>
    <div class="row">
      <div class="col">
        <label for="youtubeUrl">YouTube</label>
        <input type="url" id="youtubeUrl" placeholder="https://youtube.com/@...">
      </div>
      <div class="col">
        <label for="discordUrl">Discord (user / server)</label>
        <input type="url" id="discordUrl" placeholder="https://discord.com/users/...">
      </div>
    </div>
  </fieldset>

  <!-- Треки -->
  <fieldset>
    <legend>Музыка (до 2 треков, как сейчас)</legend>
    <div class="tracks">
      <!-- Трек 1 -->
      <div class="track" data-index="0">
        <div class="track-header">
          <span>Трек 1</span>
          <label>
            <input type="radio" name="selectedTrack" value="0">
            выбран по умолчанию
          </label>
        </div>
        <label>Название</label>
        <input type="text" class="track-title" placeholder="Название трека">

        <label>URL аудио (mp3)</label>
        <input type="url" class="track-url" placeholder="https://...mp3">

        <label>Обложка (картинка)</label>
        <input type="url" class="track-cover" placeholder="https://...">
      </div>

      <!-- Трек 2 -->
      <div class="track" data-index="1">
        <div class="track-header">
          <span>Трек 2</span>
          <label>
            <input type="radio" name="selectedTrack" value="1">
            выбран по умолчанию
          </label>
        </div>
        <label>Название</label>
        <input type="text" class="track-title" placeholder="Название трека">

        <label>URL аудио (mp3)</label>
        <input type="url" class="track-url" placeholder="https://...mp3">

        <label>Обложка (картинка)</label>
        <input type="url" class="track-cover" placeholder="https://...">
      </div>
    </div>
  </fieldset>

  <div class="btn-row">
    <button class="primary" id="saveBtn">Сохранить в профиль</button>
    <button id="resetBtn">Сбросить к дефолтному профилю</button>
    <button id="reloadBtn">Перечитать из localStorage</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
  const PROFILE_KEY = 'Lolekx228_profile';

  const defaultProfile = {
    displayName: "Lolekx228",
    description: "Hiii Me: Animation artist, Voice actor, Programmer, Web Developer, Game Developer, 3D modeler",
    location: "Україна, ДНР, Донецьк",
    accentColor: "#5b5b5b",
    textColor: "#ffffff",
    bgColor: "#080808",
    gradientEnabled: true,
    gradient1: "#6f0000",
    gradient2: "#933800",
    backgroundEffect: "blurred",
    blur: 10,
    opacity: 0.9,
    monochrome: true,
    animatedTitle: true,
    audio: [
      { title: "Durnojj Vkus - Plastinki", selected: true,
        url: "https://r2.guns.lol/e2040c07-063d-4f8d-bf4a-4a784e5cb3f2.mp3",
        cover: "https://r2.guns.lol/8b57c2d3-3cd2-4915-ad39-431819946a45.webp"
      },
      { title: "Kino - Spokojjnaya Noch", selected: false,
        url: "https://r2.guns.lol/ef254576-8efc-4601-a39a-025acd7f50af.mp3",
        cover: "https://r2.guns.lol/998a3ed5-4b5d-41c0-bdbe-c3ce107fc6b0.webp"
      }
    ],
    socials: [
      { name: "youtube", url: "https://youtube.com/@Lolekx228" },
      { name: "discord", url: "https://discord.com/users/919815468519391252" }
    ],
    backgroundUrl: "https://r2.guns.lol/404eaec9-de84-4ca0-b031-6059b171072a.webp",
    avatarUrl: "https://r2.guns.lol/a90d9caf-a563-4b08-a030-1febdba3397e.webp"
  };

  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (!raw) return defaultProfile;
      const parsed = JSON.parse(raw);
      return { ...defaultProfile, ...parsed };
    } catch {
      return defaultProfile;
    }
  }

  function saveProfile(profile) {
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  }

  const statusEl = document.getElementById('status');

  function setStatus(text, type = 'ok') {
    statusEl.textContent = text;
    statusEl.className = 'status ' + type;
    if (!text) return;
    setTimeout(() => {
      statusEl.textContent = '';
      statusEl.className = 'status';
    }, 2000);
  }

  function fillFormFromProfile(profile) {
    document.getElementById('displayName').value = profile.displayName || '';
    document.getElementById('description').value = profile.description || '';
    document.getElementById('location').value = profile.location || '';

    document.getElementById('avatarUrl').value = profile.avatarUrl || '';
    document.getElementById('backgroundUrl').value = profile.backgroundUrl || '';

    document.getElementById('textColor').value = profile.textColor || '#ffffff';
    document.getElementById('accentColor').value = profile.accentColor || '#5b5b5b';
    document.getElementById('gradient1').value = profile.gradient1 || '#6f0000';
    document.getElementById('gradient2').value = profile.gradient2 || '#933800';
    document.getElementById('bgColor').value = profile.bgColor || '#080808';

    document.getElementById('gradientEnabled').checked = !!profile.gradientEnabled;
    document.getElementById('monochrome').checked = !!profile.monochrome;
    document.getElementById('animatedTitle').checked = !!profile.animatedTitle;

    document.getElementById('opacity').value = String(profile.opacity ?? 0.9);
    document.getElementById('blur').value = String(profile.blur ?? 10);

    let youtubeUrl = '';
    let discordUrl = '';
    (profile.socials || []).forEach(s => {
      if (s.name === 'youtube') youtubeUrl = s.url || '';
      if (s.name === 'discord') discordUrl = s.url || '';
    });
    document.getElementById('youtubeUrl').value = youtubeUrl;
    document.getElementById('discordUrl').value = discordUrl;

    const trackBlocks = document.querySelectorAll('.track');
    const audioArr = profile.audio || [];
    trackBlocks.forEach(block => {
      const idx = Number(block.dataset.index);
      const track = audioArr[idx] || {};
      block.querySelector('.track-title').value = track.title || '';
      block.querySelector('.track-url').value = track.url || '';
      block.querySelector('.track-cover').value = track.cover || '';
      const radio = block.querySelector('input[type="radio"]');
      radio.checked = !!track.selected;
    });

    if (!Array.from(document.querySelectorAll('input[name="selectedTrack"]')).some(r => r.checked)) {
      const first = document.querySelector('input[name="selectedTrack"]');
      if (first) first.checked = true;
    }
  }

  function collectProfileFromForm(prevProfile) {
    const profile = { ...defaultProfile, ...prevProfile };

    profile.displayName = document.getElementById('displayName').value || defaultProfile.displayName;
    profile.description = document.getElementById('description').value || defaultProfile.description;
    profile.location = document.getElementById('location').value || defaultProfile.location;

    profile.avatarUrl = document.getElementById('avatarUrl').value || defaultProfile.avatarUrl;
    profile.backgroundUrl = document.getElementById('backgroundUrl').value || defaultProfile.backgroundUrl;

    profile.textColor = document.getElementById('textColor').value || defaultProfile.textColor;
    profile.accentColor = document.getElementById('accentColor').value || defaultProfile.accentColor;
    profile.gradient1 = document.getElementById('gradient1').value || defaultProfile.gradient1;
    profile.gradient2 = document.getElementById('gradient2').value || defaultProfile.gradient2;
    profile.bgColor = document.getElementById('bgColor').value || defaultProfile.bgColor;

    profile.gradientEnabled = document.getElementById('gradientEnabled').checked;
    profile.monochrome = document.getElementById('monochrome').checked;
    profile.animatedTitle = document.getElementById('animatedTitle').checked;

    const opacityStr = document.getElementById('opacity').value.trim();
    let opacity = parseFloat(opacityStr);
    if (isNaN(opacity)) opacity = defaultProfile.opacity;
    opacity = Math.max(0.5, Math.min(1, opacity));
    profile.opacity = opacity;

    const blurStr = document.getElementById('blur').value.trim();
    let blur = parseFloat(blurStr);
    if (isNaN(blur)) blur = defaultProfile.blur;
    blur = Math.max(0, Math.min(30, blur));
    profile.blur = blur;

    const youtubeUrl = document.getElementById('youtubeUrl').value.trim();
    const discordUrl = document.getElementById('discordUrl').value.trim();
    const socials = [];
    if (youtubeUrl) socials.push({ name: 'youtube', url: youtubeUrl });
    if (discordUrl) socials.push({ name: 'discord', url: discordUrl });
    profile.socials = socials.length ? socials : defaultProfile.socials;

    const trackBlocks = document.querySelectorAll('.track');
    const audio = [];
    trackBlocks.forEach(block => {
      const idx = Number(block.dataset.index);
      const title = block.querySelector('.track-title').value.trim();
      const url = block.querySelector('.track-url').value.trim();
      const cover = block.querySelector('.track-cover').value.trim();
      const radio = block.querySelector('input[type="radio"]');
      if (!title && !url) return;
      audio.push({
        title: title || `Track ${idx + 1}`,
        url,
        cover,
        selected: radio.checked
      });
    });

    if (!audio.length) {
      profile.audio = defaultProfile.audio;
    } else {
      if (!audio.some(t => t.selected)) {
        audio[0].selected = true;
      }
      profile.audio = audio;
    }

    return profile;
  }

  const saveBtn = document.getElementById('saveBtn');
  const resetBtn = document.getElementById('resetBtn');
  const reloadBtn = document.getElementById('reloadBtn');

  document.addEventListener('DOMContentLoaded', () => {
    const prof = loadProfile();
    fillFormFromProfile(prof);
  });

  saveBtn.addEventListener('click', () => {
    try {
      const current = loadProfile();
      const updated = collectProfileFromForm(current);
      saveProfile(updated);
      setStatus('Профиль сохранён. Обнови главную страницу с карточкой.', 'ok');
    } catch (e) {
      console.error(e);
      setStatus('Ошибка при сохранении профиля: ' + e, 'err');
    }
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('Сбросить профиль к дефолтным значениям?')) return;
    saveProfile(defaultProfile);
    fillFormFromProfile(defaultProfile);
    setStatus('Профиль сброшен к дефолтному.', 'ok');
  });

  reloadBtn.addEventListener('click', () => {
    const prof = loadProfile();
    fillFormFromProfile(prof);
    setStatus('Профиль перечитан из localStorage.', 'ok');
  });
</script>
</body>
</html>
