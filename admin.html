<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админка Lolekx-card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050505;
      color: #fff;
    }
    .wrap {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 10px;
    }
    .note {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 20px;
    }
    button {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #333;
    }
    pre {
      margin-top: 16px;
      padding: 12px;
      background: #111;
      border-radius: 8px;
      overflow: auto;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Админка Lolekx-card</h1>
  <p class="note">
    Стартовая заглушка админки. Позже сюда можно завезти нормальные настройки профиля.
  </p>

  <button id="loadProfileBtn">Показать текущий профиль из localStorage</button>
  <pre id="profileDump">(пока пусто)</pre>
</div>

<script>
  const PROFILE_KEY = 'Lolekx228_profile';

  document.getElementById('loadProfileBtn').addEventListener('click', () => {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (!raw) {
        document.getElementById('profileDump').textContent =
          'В localStorage нет сохранённого профиля по ключу ' + PROFILE_KEY;
        return;
      }
      const parsed = JSON.parse(raw);
      document.getElementById('profileDump').textContent =
        JSON.stringify(parsed, null, 2);
    } catch (e) {
      document.getElementById('profileDump').textContent =
        'Ошибка при чтении профиля: ' + e;
    }
  });
</script>
</body>
</html>
