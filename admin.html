<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lolekx's Card Настройки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            font-family: 'Onest', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            padding: 40px 24px 80px;
            display: flex;
            justify-content: center;
        }

        .customize-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .settings-section { margin-bottom: 48px; }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            display: block;
        }

        .settings-card {
            background: #111111;
            border-radius: 24px;
            padding: 24px 20px;
            border: 1px solid #2a2a2a;
        }

        .media-row-horizontal {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
        }
        .media-item {
            flex: 1 1 180px;
            max-width: 260px;
            background: #1a1a1a;
            border-radius: 18px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .media-item:hover { background: #252525; }
        .media-label {
            font-weight: 500;
            color: #aaa;
            margin-bottom: 10px;
            font-size: 0.8rem;
        }
        .media-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .file-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 0.65rem;
            color: #888;
            background: #0a0a0a;
            padding: 3px 8px;
            border-radius: 999px;
        }
        .file-badge span:last-child {
            font-size: 0.7rem;
            opacity: 0.7;
        }
        .media-preview {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: cover;
        }
        .audio-placeholder, .cursor-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: white;
            font-size: 0.7rem;
            min-height: 70px;
        }
        .audio-placeholder svg, .cursor-placeholder svg {
            width: 28px;
            height: 28px;
        }

        .settings-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .two-columns {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: space-between;
        }
        .settings-column {
            flex: 1 1 230px;
        }
        .setting-item { margin-bottom: 18px; }
        .setting-label {
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #ddd;
        }
        .input-wrapper {
            background: #1a1a1a;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-wrapper input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 0.85rem;
        }

        .slider-container { margin-top: 6px; }
        .slider {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            appearance: none;
        }
        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #5b5b5b;
            border-radius: 50%;
            cursor: pointer;
        }

        .location-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .location-row .input-wrapper {
            flex: 1 1 200px;
        }

        .color-picker-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            border: 2px solid #fff;
            cursor: pointer;
        }
        .color-input {
            background: #1a1a1a;
            border: none;
            padding: 8px 10px;
            border-radius: 14px;
            color: white;
            font-family: monospace;
            font-size: 0.8rem;
            flex: 1 1 80px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .checkbox-label { color: #ddd; font-size: 0.85rem; }

        .toggle-switch {
            position: relative;
            width: 42px;
            height: 22px;
            display: inline-block;
            flex-shrink: 0;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #333;
            border-radius: 999px;
            transition: 0.2s;
        }
        .toggle-slider::before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 3px;
            top: 3px;
            background-color: #fff;
            border-radius: 50%;
            transition: 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: #5b5b5b;
        }
        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(18px);
        }

        hr {
            border-color: #2a2a2a;
            margin: 16px 0;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .audio-manager-modal {
            background: #111111;
            border-radius: 28px;
            width: 90%;
            max-width: 520px;
            border: 1px solid #2a2a2a;
            overflow: visible;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
        }
        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .close-modal {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-content {
            padding: 16px 20px;
            overflow: visible;
        }

        .audio-list {
            margin-top: 24px;
            margin-bottom: 24px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Плашка трека на всю ширину */
        .audio-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
            max-width: none;
            box-sizing: border-box;
        }
        .audio-item.active {
            background: #2a2a2a;
            border-color: #5b5b5b;
        }
        .audio-cover-small {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            background-color: #2c2c2c;
            flex-shrink: 0;
        }
        .audio-info {
            flex: 1 1 auto;
            min-width: 0;
        }
        .audio-title {
            font-weight: 500;
            margin-bottom: 1px;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .audio-badge {
            font-size: 0.6rem;
            background: #5b5b5b;
            padding: 1px 5px;
            border-radius: 20px;
            display: inline-block;
        }
        .edit-audio-btn {
            background: none;
            border: 1px solid #444;
            color: #ccc;
            cursor: pointer;
            padding: 4px 9px;
            border-radius: 12px;
            font-size: 0.7rem;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .edit-audio-btn:hover {
            background: #333;
            color: white;
            border-color: #666;
        }

        /* Крестик торчит наружу вверх */
        .audio-delete-btn {
            position: absolute;
            top: -10px;
            right: 6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3a0000;
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: 0.15s;
            z-index: 5;
        }
        .audio-delete-btn:hover {
            background: #ff4d4d;
            color: #1a1a1a;
        }
        .audio-delete-btn span {
            transform: translateY(-0.5px);
        }

        .add-audio-btn {
            background: #5b5b5b;
            border: none;
            padding: 8px 14px;
            border-radius: 999px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            margin-top: 10px;
            width: 100%;
            justify-content: center;
            font-size: 0.8rem;
        }
        .add-audio-btn:hover { background: #6c6c6c; }

        .setting-switch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
            flex-wrap: wrap;
            gap: 6px;
        }
        .setting-switch:last-child { border-bottom: none; }
        .setting-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .setting-title { font-weight: 500; font-size: 0.85rem; }
        .setting-description {
            font-size: 0.7rem;
            color: #888;
        }

        .edit-audio-modal {
            background: #111111;
            border-radius: 22px;
            width: 90%;
            max-width: 480px;
            border: 1px solid #2a2a2a;
            padding: 16px 18px 18px;
        }
        .edit-audio-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .edit-audio-modal-header h3 {
            font-size: 1rem;
            font-weight: 600;
        }
        .edit-audio-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
        }
        .edit-row { margin-bottom: 12px; }
        .edit-label {
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #ddd;
        }
        .edit-input-text {
            width: 100%;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            background: #1a1a1a;
            color: #fff;
            font-size: 0.8rem;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-input-button {
            border-radius: 999px;
            padding: 5px 12px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #eee;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .file-input-button:hover {
            background: #2a2a2a;
        }
        .file-input-name {
            font-size: 0.7rem;
            color: #888;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-cover-preview {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            background-color: #2c2c2c;
        }
        .edit-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-small {
            border-radius: 999px;
            padding: 5px 12px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #eee;
            font-size: 0.75rem;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-small.primary {
            background: #5b5b5b;
            border-color: #5b5b5b;
        }
        .btn-small.primary:hover {
            background: #6c6c6c;
        }
        .btn-small:active {
            transform: scale(0.96);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%) translateY(20px);
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(20,20,20,0.95);
            border: 1px solid #444;
            color: #eee;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 2000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .toast-icon {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3a7a3a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
        }

        @media (max-width: 768px) {
            body { padding: 24px 12px 70px; }
            .settings-card { padding: 18px 14px; }
            .section-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="customize-container">
    <div class="settings-section">
        <span class="section-title">Пример настроек</span>
        <div class="settings-card">
            <button id="openAudioManagerBtn" class="add-audio-btn">Открыть менеджер аудио</button>
        </div>
    </div>
</div>

<div id="toast" class="toast">
    <div class="toast-icon">✓</div>
    <span id="toastText">Ок</span>
</div>

<div id="audioManagerModal" class="modal-overlay">
    <div class="audio-manager-modal">
        <div class="modal-header">
            <h2>Менеджер аудио</h2>
            <button class="close-modal" id="closeModalBtn">×</button>
        </div>
        <div class="modal-content">
            <div class="audio-list" id="audioList"></div>

            <button class="add-audio-btn" id="addAudioBtn">+ Добавить аудио</button>

            <div class="setting-switch">
                <div class="setting-left">
                    <span class="setting-title">Перемешивание аудио</span>
                    <span class="setting-description">Проигрывать случайное аудио при каждом посещении страницы</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="shuffleCheckbox">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="setting-switch">
                <div class="setting-left">
                    <span class="setting-title">Аудиоплеер</span>
                    <span class="setting-description">Добавляет в профиль виджет аудиоплеера</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="playerEnabledCheckbox" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>
    </div>
</div>

<div id="editAudioOverlay" class="modal-overlay">
    <div class="edit-audio-modal">
        <div class="edit-audio-modal-header">
            <h3>Редактировать аудио</h3>
            <button class="edit-audio-close" id="closeEditModalBtn">×</button>
        </div>
        <div class="edit-row">
            <div class="edit-label">Название</div>
            <input type="text" id="editTitleInput" class="edit-input-text" placeholder="Название трека">
        </div>

        <div class="edit-row">
            <div class="edit-label">Файл аудио (.mp3)</div>
            <div class="file-input-wrapper">
                <span class="file-input-button">Выбрать аудио</span>
                <span class="file-input-name" id="editAudioFileName">Файл не выбран</span>
                <input type="file" id="editAudioFile" accept="audio/mpeg,audio/mp3">
            </div>
        </div>

        <div class="edit-row">
            <div class="edit-label">Обложка</div>
            <div class="file-input-wrapper">
                <span class="file-input-button">Выбрать обложку</span>
                <span class="file-input-name" id="editCoverFileName">Файл не выбран</span>
                <input type="file" id="editCoverFile" accept="image/*">
                <div class="edit-cover-preview" id="editCoverPreview"></div>
            </div>
        </div>

        <div class="edit-modal-actions">
            <button class="btn-small" id="cancelEditBtn">Отмена</button>
            <button class="btn-small primary" id="saveEditBtn">Сохранить</button>
        </div>
    </div>
</div>

<script>
    const audioList = document.getElementById('audioList');
    const addAudioBtn = document.getElementById('addAudioBtn');
    const audioManagerModal = document.getElementById('audioManagerModal');
    const openAudioManagerBtn = document.getElementById('openAudioManagerBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const editOverlay = document.getElementById('editAudioOverlay');
    const closeEditModalBtn = document.getElementById('closeEditModalBtn');
    const editTitleInput = document.getElementById('editTitleInput');
    const editAudioFile = document.getElementById('editAudioFile');
    const editCoverFile = document.getElementById('editCoverFile');
    const editAudioFileName = document.getElementById('editAudioFileName');
    const editCoverFileName = document.getElementById('editCoverFileName');
    const editCoverPreview = document.getElementById('editCoverPreview');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const saveEditBtn = document.getElementById('saveEditBtn');

    const shuffleCheckbox = document.getElementById('shuffleCheckbox');
    const playerEnabledCheckbox = document.getElementById('playerEnabledCheckbox');

    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    const PROFILE_KEY = 'Lolekx228_profile_audio';

    const baseProfile = {
        audioShuffle: false,
        audioPlayerEnabled: true,
        audio: [
            {
                title: "Durnojj Vkus - Plastinki",
                url: "",
                cover: "",
                active: true
            },
            {
                title: "Kino - Spokojjnaya Noch",
                url: "",
                cover: "",
                active: false
            }
        ]
    };

    function deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
    }

    function loadProfile(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            if (!raw) return deepClone(fallback);
            const parsed = JSON.parse(raw);
            return { ...fallback, ...parsed };
        } catch {
            return deepClone(fallback);
        }
    }

    function saveProfile(key, data) {
        localStorage.setItem(key, JSON.stringify(data));
    }

    let profile = loadProfile(PROFILE_KEY, baseProfile);

    function showToast(message) {
        toastText.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function createAudioItemElement(track, index) {
        const div = document.createElement('div');
        div.className = 'audio-item';
        if (track.active) div.classList.add('active');
        div.dataset.index = index;

        const coverUrl = track.cover || 'https://via.placeholder.com/40/2a2a2a/ffffff?text=🎵';

        div.innerHTML = `
            <button class="audio-delete-btn" title="Удалить трек">
                <span>×</span>
            </button>
            <div class="audio-cover-small" style="background-image: url('${coverUrl}');"></div>
            <div class="audio-info">
                <div class="audio-title">${escapeHtml(track.title || 'Без названия')}</div>
                ${track.active ? '<span class="audio-badge">Активно</span>' : ''}
            </div>
            <button class="edit-audio-btn">Редактировать</button>
        `;

        div.addEventListener('click', () => {
            (profile.audio || []).forEach((t, i) => {
                t.active = (i === index);
            });
            renderAudioList();
            saveProfile(PROFILE_KEY, profile);
        });

        const editBtn = div.querySelector('.edit-audio-btn');
        editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openEditModal(index);
        });

        const deleteBtn = div.querySelector('.audio-delete-btn');
        deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!Array.isArray(profile.audio)) return;
            profile.audio.splice(index, 1);
            renderAudioList();
            saveProfile(PROFILE_KEY, profile);
        });

        return div;
    }

    function renderAudioList() {
        audioList.innerHTML = '';
        const list = profile.audio || [];
        list.forEach((track, index) => {
            const el = createAudioItemElement(track, index);
            audioList.appendChild(el);
        });
        shuffleCheckbox.checked = profile.audioShuffle;
        playerEnabledCheckbox.checked = profile.audioPlayerEnabled;
    }

    let editingIndex = null;

    function openEditModal(index) {
        editingIndex = index;
        const track = profile.audio[index] || {};
        editTitleInput.value = track.title || '';
        editAudioFile.value = '';
        editCoverFile.value = '';
        editAudioFileName.textContent = 'Файл не выбран';
        editCoverFileName.textContent = 'Файл не выбран';
        editCoverPreview.style.backgroundImage = track.cover ? `url('${track.cover}')` : 'none';
        editOverlay.classList.add('active');
    }

    function closeEditModal() {
        editingIndex = null;
        editOverlay.classList.remove('active');
    }

    // модалки
    openAudioManagerBtn.addEventListener('click', () => {
        renderAudioList();
        audioManagerModal.classList.add('active');
    });

    closeModalBtn.addEventListener('click', () => {
        audioManagerModal.classList.remove('active');
    });

    audioManagerModal.addEventListener('click', (e) => {
        if (e.target === audioManagerModal) audioManagerModal.classList.remove('active');
    });

    closeEditModalBtn.addEventListener('click', closeEditModal);
    cancelEditBtn.addEventListener('click', closeEditModal);
    editOverlay.addEventListener('click', (e) => {
        if (e.target === editOverlay) closeEditModal();
    });

    // добавление
    addAudioBtn.addEventListener('click', () => {
        profile.audio = profile.audio || [];
        profile.audio.push({
            title: 'Новый трек',
            url: '',
            cover: '',
            active: false
        });
        renderAudioList();
        saveProfile(PROFILE_KEY, profile);
    });

    editAudioFile.addEventListener('change', () => {
        const file = editAudioFile.files[0];
        if (!file) return;
        editAudioFileName.textContent = file.name;
    });

    editCoverFile.addEventListener('change', () => {
        const file = editCoverFile.files[0];
        if (!file) return;
        editCoverFileName.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (e) => {
            editCoverPreview.style.backgroundImage = `url('${e.target.result}')`;
        };
        reader.readAsDataURL(file);
    });

    saveEditBtn.addEventListener('click', () => {
        if (editingIndex === null) return;
        const track = profile.audio[editingIndex] || {};

        if (editTitleInput.value.trim()) {
            track.title = editTitleInput.value.trim();
        }

        const audioFile = editAudioFile.files[0];
        if (audioFile) {
            const audioUrl = URL.createObjectURL(audioFile);
            track.url = audioUrl;
        }

        const coverFile = editCoverFile.files[0];
        if (coverFile) {
            const reader = new FileReader();
            reader.onload = (e) => {
                track.cover = e.target.result;
                profile.audio[editingIndex] = track;
                renderAudioList();
                closeEditModal();
                saveProfile(PROFILE_KEY, profile);
            };
            reader.readAsDataURL(coverFile);
            return;
        }

        profile.audio[editingIndex] = track;
        renderAudioList();
        closeEditModal();
        saveProfile(PROFILE_KEY, profile);
    });

    shuffleCheckbox.addEventListener('change', () => {
        profile.audioShuffle = shuffleCheckbox.checked;
        saveProfile(PROFILE_KEY, profile);
    });

    playerEnabledCheckbox.addEventListener('change', () => {
        profile.audioPlayerEnabled = playerEnabledCheckbox.checked;
        saveProfile(PROFILE_KEY, profile);
    });

    renderAudioList();
</script>
</body>
</html>
