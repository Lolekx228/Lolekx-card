<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lolekx-card | Настройки профиля</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Onest', 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 16px;
    }

    .two-columns {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 20px;
      align-items: flex-start;
    }

    .settings-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 24px;
      padding: 16px 18px 18px;
    }

    .settings-section h2 {
      font-size: 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-section p.section-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    label {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="text"],
    textarea,
    select {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 8px 10px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
      max-height: 160px;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(255,255,255,0.3);
    }

    .upload-box {
      border-radius: 16px;
      padding: 10px;
      border: 1px dashed rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .upload-box span {
      color: rgba(255,255,255,0.8);
    }

    .upload-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .chip {
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      font-size: 11px;
      color: rgba(255,255,255,0.7);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .toggle-row span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 20px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: rgba(255,255,255,0.2);
      transition: .2s;
      border-radius: 999px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    .toggle input:checked + .slider {
      background-color: #28a745;
    }

    .toggle input:checked + .slider:before {
      transform: translateX(20px);
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-row input[type="color"] {
      width: 36px;
      height: 30px;
      padding: 0;
      border-radius: 8px;
      border: none;
      background: transparent;
    }

    .hint {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }

      width: 100%;
      border-radius: 40px;
