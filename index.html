<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lolekx228 Profile Card</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Onest', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #080808;
      padding: 20px;
      animation: fadeIn 0.5s ease;
      color: #ffffff;
      gap: 10px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .background-blur {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(10px) brightness(0.7);
      z-index: -2;
    }

    .profile-card,
    .media-card {
      max-width: 520px;
      width: 100%;
    }

    .profile-card {
      border-radius: 20px;
      padding: 24px 20px 18px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      transition: box-shadow 0.2s ease;
      backdrop-filter: blur(8px);
      background: linear-gradient(25deg, rgba(111,0,0,0.7), rgba(147,56,0,0.7));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile-card:hover {
      box-shadow: 0 20px 44px rgba(0,0,0,0.6);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #5b5b5b;
      margin-bottom: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .username {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .username.animated {
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 4px var(--accent-color, #5b5b5b); }
      to { text-shadow: 0 0 14px var(--accent-color, #5b5b5b); }
    }

    .is-hidden { display: none !important; }

    .description {
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.5;
      text-align: center;
    }

    .location-wrapper {
      display: flex;
      justify-content: center;
    }

    .location {
      font-size: 14px;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 3px 10px;
      border-radius: 999px;
      position: relative;
    }

    .location-icon {
      width: 14px;
      height: 14px;
      display: inline-block;
    }

    .location-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .location-text {
      display: inline-block;
      line-height: 1.2;
    }

    .location-tooltip {
      position: absolute;
      left: 50%;
      bottom: 120%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
    }

    .location-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px;
      border-style: solid;
      border-color: rgba(0,0,0,0.85) transparent transparent transparent;
    }

    .location:hover .location-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .social-links a {
      background: rgba(0,0,0,0.55);
      padding: 7px 18px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: background 0.2s ease, border-color 0.2s ease;
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
    }

    .social-links a:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.26);
    }

    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .media-card {
      border-radius: 20px;
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      background: linear-gradient(25deg, rgba(111,0,0,0.7), rgba(147,56,0,0.7));
    }

    .audio-player-card {
      background: rgba(0,0,0,0.65);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .audio-cover {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
    }

    .audio-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .audio-info { flex: 1; min-width: 160px; }

    .audio-title {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 11px;
      opacity: 0.8;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 3px;
      transition: width 0.05s linear;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.9;
      transition: background 0.1s ease, opacity 0.1s ease;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      opacity: 1;
      background: rgba(255,255,255,0.16);
    }

    .ctrl-btn svg {
      width: 17px;
      height: 17px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .play-btn svg {
      width: 18px;
      height: 18px;
    }

    .play-btn {
      background: #ffffff;
      color: #000000;
      width: 32px;
      height: 32px;
      font-size: 14px;
      border-radius: 50%;
    }

    .play-btn:hover {
      background: #e0e0e0;
    }

    .volume-slider {
      width: 70px;
      height: 3px;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body { justify-content: flex-start; }
      .profile-card { padding: 20px 14px 16px; }
      .username { font-size: 26px; }
      .description { font-size: 14px; }
      .avatar { width: 90px; height: 90px; }
      .social-links a { padding: 6px 14px; font-size: 13px; }
      .audio-player-card {
        flex-direction: column;
        text-align: center;
      }
      .audio-cover { width: 80px; height: 80px; }
      .audio-controls { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="background-blur" id="bgBlur"></div>

<div class="profile-card" id="profileCard">
  <img class="avatar" id="avatar" src="" alt="Avatar">
  <h1 class="username" id="username"></h1>
  <p class="description" id="description"></p>

  <div class="location-wrapper" id="locationWrapper">
    <div class="location" id="location">
      <span class="location-icon">
        <svg viewBox="4 2 16 20" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor"
                d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 10q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22">
          </path>
        </svg>
      </span>
      <span class="location-text"></span>
      <span class="location-tooltip" id="locationTooltip"></span>
    </div>
  </div>

  <div class="social-links" id="socialLinks"></div>
</div>

<div class="media-card" id="mediaCard">
  <div id="audioPlayerContainer"></div>
</div>

<script>
  const PROFILE_KEY = 'Lolekx228_profile';
  const PROFILE_DEFAULT_KEY = 'Lolekx228_profile_default';

  const builtinProfile = {
    displayName: "Lolekx228",
    description: "Hiii Me: Animation artist, Voice actor, Programmer, Web Developer, Game Developer, 3D modeler",
    locationShort: "Україна, ДНР, Донецьк",
    locationFull: "Україна, Донецкая Народная Республика, город Донецьк",
    location: "Україна, ДНР, Донецьк",
    accentColor: "#5b5b5b",
    textColor: "#ffffff",
    bgColor: "#080808",
    iconColor: "#ffffff",
    gradientEnabled: true,
    gradient1: "#6f0000",
    gradient2: "#933800",
    blur: 10,
    opacity: 0.9,
    monochrome: true,
    animatedTitle: true,
    swapBlocks: false,
    volumeControl: true,
    audioShuffle: false,
    audioPlayerEnabled: true,
    cursorUrl: "",
    audio: [
      {
        title: "Durnojj Vkus - Plastinki",
        url: "https://r2.guns.lol/e2040c07-063d-4f8d-bf4a-4a784e5cb3f2.mp3",
        cover: "https://r2.guns.lol/8b57c2d3-3cd2-4915-ad39-431819946a45.webp",
        active: true
      },
      {
        title: "Kino - Spokojjnaya Noch",
        url: "https://r2.guns.lol/ef254576-8efc-4601-a39a-025acd7f50af.mp3",
        cover: "https://r2.guns.lol/998a3ed5-4b5d-41c0-bdbe-c3ce107fc6b0.webp",
        active: false
      }
    ],
    socials: [
      { name: "youtube", url: "https://youtube.com/@Lolekx228" },
      { name: "discord", url: "https://discord.com/users/919815468519391252" }
    ],
    backgroundUrl: "https://r2.guns.lol/404eaec9-de84-4ca0-b031-6059b171072a.webp",
    avatarUrl: "https://r2.guns.lol/a90d9caf-a563-4b08-a030-1febdba3397e.webp"
  };

  const bgBlur = document.getElementById('bgBlur');
  const profileCard = document.getElementById('profileCard');
  const mediaCard = document.getElementById('mediaCard');
  const avatar = document.getElementById('avatar');
  const usernameEl = document.getElementById('username');
  const descriptionEl = document.getElementById('description');
  const locationEl = document.getElementById('location');
  const locationWrapper = document.getElementById('locationWrapper');
  const locationTextEl = locationEl.querySelector('.location-text');
  const locationTooltipEl = document.getElementById('locationTooltip');
  const socialLinksEl = document.getElementById('socialLinks');
  const audioPlayerContainer = document.getElementById('audioPlayerContainer');

  let profile = { ...builtinProfile };
  let titleTimer = null;
  let playlist = [];
  let currentTrackIndex = 0;
  const MAX_VOLUME = 1;
  let currentVolume = 0.5;
  let lastNonZeroVolume = 0.5;
  let audio = null;
  let playerRenderVersion = 0;

  function deepMergeProfile(base, patch) {
    if (!patch || typeof patch !== 'object' || Array.isArray(patch)) return { ...base };
    const merged = { ...base, ...patch };
    if (!Array.isArray(patch.audio)) merged.audio = Array.isArray(base.audio) ? base.audio : [];
    if (!Array.isArray(patch.socials)) merged.socials = Array.isArray(base.socials) ? base.socials : [];
    return merged;
  }

  function fingerprintText(text) {
    let hash = 2166136261;
    for (let i = 0; i < text.length; i++) {
      hash ^= text.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    return (hash >>> 0).toString(16).padStart(8, '0');
  }

  function normalizeProfileConfig(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { ...builtinProfile };
    const hasSections = raw.profile && typeof raw.profile === 'object' || raw.settings && typeof raw.settings === 'object';
    const patch = hasSections
      ? { ...(raw.profile || {}), ...(raw.settings || {}) }
      : raw;
    return deepMergeProfile(builtinProfile, patch);
  }

  let publishedFingerprint = 'builtin';

  async function loadPublishedProfile() {
    try {
      const response = await fetch('./profile.json', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const rawText = await response.text();
      publishedFingerprint = fingerprintText(rawText);
      return normalizeProfileConfig(JSON.parse(rawText));
    } catch (error) {
      publishedFingerprint = 'builtin';
      console.warn('profile.json не загружен, используется встроенный профиль.', error);
      return { ...builtinProfile };
    }
  }

  function readStoredProfile(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.__lolekxLocal !== 1 || !parsed.data) return null;
      if (parsed.sourceFingerprint !== publishedFingerprint) return null;
      return parsed.data;
    } catch (error) {
      console.warn(`Не удалось прочитать ${key}.`, error);
      return null;
    }
  }

  function loadLocalProfile(publishedProfile) {
    const localDefault = readStoredProfile(PROFILE_DEFAULT_KEY);
    const localProfile = readStoredProfile(PROFILE_KEY);
    return deepMergeProfile(
      deepMergeProfile(publishedProfile, localDefault),
      localProfile
    );
  }

  function safeUrl(value, allowedProtocols = ['http:', 'https:', 'data:', 'blob:']) {
    if (typeof value !== 'string' || !value.trim()) return '';
    const trimmed = value.trim();
    if (trimmed.startsWith('data:')) return allowedProtocols.includes('data:') ? trimmed : '';
    if (trimmed.startsWith('blob:')) return allowedProtocols.includes('blob:') ? trimmed : '';
    try {
      const parsed = new URL(trimmed, window.location.href);
      return allowedProtocols.includes(parsed.protocol) ? parsed.href : '';
    } catch {
      return '';
    }
  }

  const ASSET_DB_NAME = 'lolekx-card-assets-v1';
  const ASSET_STORE_NAME = 'assets';
  const runtimeAssetUrls = new Map();

  function isIndexedAssetRef(value) {
    return typeof value === 'string' && value.startsWith('idb:');
  }

  function openAssetDb() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(ASSET_DB_NAME, 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(ASSET_STORE_NAME)) {
          db.createObjectStore(ASSET_STORE_NAME, { keyPath: 'id' });
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('Не удалось открыть хранилище файлов'));
    });
  }

  async function resolveAssetUrl(value) {
    if (!isIndexedAssetRef(value)) return safeUrl(value);
    try {
      const db = await openAssetDb();
      const id = value.slice(4);
      const record = await new Promise((resolve, reject) => {
        const tx = db.transaction(ASSET_STORE_NAME, 'readonly');
        const request = tx.objectStore(ASSET_STORE_NAME).get(id);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error || new Error('Не удалось прочитать локальный файл'));
      });
      db.close();
      if (!record?.blob) return '';
      const cached = runtimeAssetUrls.get(value);
      if (cached) return cached;
      const url = URL.createObjectURL(record.blob);
      runtimeAssetUrls.set(value, url);
      return url;
    } catch (error) {
      console.warn('Не удалось загрузить локальный файл из IndexedDB.', error);
      return '';
    }
  }

  async function setBackgroundImage(element, value) {
    const url = await resolveAssetUrl(value);
    element.style.backgroundImage = url ? `url(${JSON.stringify(url)})` : 'none';
  }

  function updateAnimatedTitle() {
    if (titleTimer) {
      clearTimeout(titleTimer);
      titleTimer = null;
    }
    const baseTitle = `${profile.displayName || 'Profile'} • Profile Card`;
    document.title = baseTitle;
    if (!profile.animatedTitle) return;

    const text = `${baseTitle} • `;
    let pos = 0;
    const tick = () => {
      document.title = text.slice(pos) + text.slice(0, pos);
      pos = (pos + 1) % text.length;
      titleTimer = setTimeout(tick, 250);
    };
    tick();
  }

  function applyBlockOrder() {
    if (profile.swapBlocks) {
      document.body.insertBefore(mediaCard, profileCard);
    } else {
      document.body.insertBefore(profileCard, mediaCard);
    }
  }

  async function applyProfile() {
    const blurValue = Number.isFinite(Number(profile.blur)) ? Math.max(0, Number(profile.blur)) : 10;
    const opacityValue = Number.isFinite(Number(profile.opacity)) ? Math.min(1, Math.max(0.4, Number(profile.opacity))) : 0.9;
    const accentColor = profile.accentColor || '#5b5b5b';
    const textColor = profile.textColor || '#ffffff';
    const iconColor = profile.iconColor || textColor;

    document.documentElement.style.setProperty('--accent-color', accentColor);
    document.body.style.backgroundColor = profile.bgColor || '#080808';
    const cursorAssetUrl = isIndexedAssetRef(profile.cursorUrl)
      ? await resolveAssetUrl(profile.cursorUrl)
      : safeUrl(profile.cursorUrl, ['data:', 'http:', 'https:']);
    document.body.style.cursor = cursorAssetUrl
      ? `url(${JSON.stringify(cursorAssetUrl)}) 0 0, auto`
      : 'auto';

    await setBackgroundImage(bgBlur, profile.backgroundUrl);
    bgBlur.style.filter = `blur(${blurValue}px) brightness(0.7)`;

    const grad = `linear-gradient(25deg, ${profile.gradient1 || '#6f0000'}, ${profile.gradient2 || '#933800'})`;
    const cardBackground = profile.gradientEnabled ? grad : (profile.bgColor || '#080808');
    profileCard.style.background = cardBackground;
    mediaCard.style.background = cardBackground;
    profileCard.style.backdropFilter = `blur(${Math.max(blurValue - 2, 0)}px)`;
    mediaCard.style.backdropFilter = `blur(${Math.max(blurValue - 2, 0)}px)`;
    profileCard.style.opacity = String(opacityValue);
    mediaCard.style.opacity = String(opacityValue);
    profileCard.style.color = textColor;
    mediaCard.style.color = textColor;

    usernameEl.textContent = profile.displayName || builtinProfile.displayName;
    descriptionEl.textContent = profile.description || '';
    usernameEl.classList.toggle('animated', Boolean(profile.animatedTitle));

    const locShort = profile.locationShort || profile.location || '';
    const locFull = profile.locationFull || profile.location || locShort;
    locationTextEl.textContent = locShort;
    locationTooltipEl.textContent = locFull;
    locationWrapper.classList.toggle('is-hidden', !locShort);

    const avatarUrl = await resolveAssetUrl(profile.avatarUrl);
    avatar.src = avatarUrl || '';
    avatar.classList.toggle('is-hidden', !avatarUrl);
    avatar.style.borderColor = accentColor;

    socialLinksEl.replaceChildren();
    (Array.isArray(profile.socials) ? profile.socials : []).forEach((social) => {
      const href = safeUrl(social?.url, ['http:', 'https:']);
      if (!href) return;

      const a = document.createElement('a');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';

      const iconSpan = document.createElement('span');
      iconSpan.className = 'icon';
      const name = String(social?.name || 'link').toLowerCase();

      if (name === 'youtube') {
        iconSpan.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.99 5 20.01 14.01" aria-hidden="true"><path fill="currentColor" d="M21.593 7.203a2.506 2.506 0 0 0-1.762-1.766C18.265 5.007 12 5 12 5s-6.264-.007-7.831.404a2.56 2.56 0 0 0-1.766 1.778c-.413 1.566-.417 4.814-.417 4.814s-.004 3.264.406 4.814c.23.857.905 1.534 1.763 1.765c1.582.43 7.83.437 7.83.437s6.265.007 7.831-.403a2.515 2.515 0 0 0 1.767-1.763c.414-1.565.417-4.812.417-4.812s.02-3.265-.407-4.831zM9.996 15.005l.005-6l5.207 3.005l-5.212 2.995z"/></svg>`;
        iconSpan.style.color = profile.monochrome ? iconColor : '#ff0033';
        a.append(iconSpan, document.createTextNode('YouTube'));
      } else if (name === 'discord') {
        iconSpan.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.96 4.26 20.03 15.53" aria-hidden="true"><path fill="currentColor" d="M14.82 4.26a10.14 10.14 0 0 0-.53 1.1a14.66 14.66 0 0 0-4.58 0a10.14 10.14 0 0 0-.53-1.1a16 16 0 0 0-4.13 1.3a17.33 17.33 0 0 0-3 11.59a16.6 16.6 0 0 0 5.07 2.59A12.89 12.89 0 0 0 8.23 18a9.65 9.65 0 0 1-1.71-.83a3.39 3.39 0 0 0 .42-.33a11.66 11.66 0 0 0 10.12 0q.21.18.42.33a10.84 10.84 0 0 1-1.71.84a12.41 12.41 0 0 0 1.08 1.78a16.44 16.44 0 0 0 5.06-2.59a17.22 17.22 0 0 0-3-11.59a16.09 16.09 0 0 0-4.09-1.35zM8.68 14.81a1.94 1.94 0 0 1-1.8-2a1.93 1.93 0 0 1 1.8-2a1.93 1.93 0 0 1 1.8 2a1.93 1.93 0 0 1-1.8 2zm6.64 0a1.94 1.94 0 0 1-1.8-2a1.93 1.93 0 0 1 1.8-2a1.92 1.92 0 0 1 1.8 2a1.92 1.92 0 0 1-1.8 2z"/></svg>`;
        iconSpan.style.color = profile.monochrome ? iconColor : '#5865f2';
        a.append(iconSpan, document.createTextNode('Discord'));
      } else {
        iconSpan.style.color = iconColor;
        a.append(iconSpan, document.createTextNode(social?.name || 'Link'));
      }
      socialLinksEl.appendChild(a);
    });

    applyBlockOrder();
    updateAnimatedTitle();
  }

  function getPlaylistFromProfile() {
    return (Array.isArray(profile.audio) ? profile.audio : []).filter((track) => track && (isIndexedAssetRef(track.url) || safeUrl(track.url)));
  }

  function chooseInitialTrackIndex() {
    if (!playlist.length) return 0;
    if (profile.audioShuffle) return Math.floor(Math.random() * playlist.length);
    const activeIndex = playlist.findIndex((track) => track.active);
    return activeIndex >= 0 ? activeIndex : 0;
  }

  function chooseRandomTrackIndex() {
    if (playlist.length <= 1) return 0;
    let next = currentTrackIndex;
    while (next === currentTrackIndex) next = Math.floor(Math.random() * playlist.length);
    return next;
  }

  function stopAudio() {
    if (audio) {
      audio.pause();
      audio.src = '';
      audio.load();
      audio = null;
    }
  }

  function rebuildPlayerFromProfile() {
    stopAudio();
    playlist = getPlaylistFromProfile();
    currentTrackIndex = chooseInitialTrackIndex();
    renderAudioPlayer();
  }

  async function renderAudioPlayer() {
    const renderVersion = ++playerRenderVersion;
    stopAudio();
    const enabled = profile.audioPlayerEnabled !== false && playlist.length > 0;
    mediaCard.classList.toggle('is-hidden', !enabled);
    audioPlayerContainer.replaceChildren();
    if (!enabled) return;

    const track = playlist[currentTrackIndex] || playlist[0];
    audioPlayerContainer.innerHTML = `
      <div class="audio-player-card">
        <div class="audio-cover"><img id="currentCover" alt="Обложка трека"></div>
        <div class="audio-info">
          <div class="audio-title" id="audioTitle"></div>
          <div class="progress-container">
            <span class="current-time" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar" role="slider" aria-label="Позиция трека" tabindex="0">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="duration" id="duration">0:00</span>
          </div>
          <div class="audio-controls">
            <button class="ctrl-btn" id="prevBtn" aria-label="Предыдущий трек"><span id="prevIcon"></span></button>
            <button class="ctrl-btn play-btn" id="playPauseBtn" aria-label="Воспроизведение/пауза"><span id="playPauseIcon"></span></button>
            <button class="ctrl-btn" id="nextBtn" aria-label="Следующий трек"><span id="nextIcon"></span></button>
            ${profile.volumeControl === false ? '' : `
              <button class="ctrl-btn" id="volumeBtn" aria-label="Громкость"><span id="volumeIcon"></span></button>
              <input type="range" id="volumeSlider" class="volume-slider" min="0" max="${MAX_VOLUME}" step="0.01" value="${currentVolume}" aria-label="Громкость">
            `}
          </div>
        </div>
      </div>`;

    document.getElementById('audioTitle').textContent = track.title || 'Без названия';
    const cover = document.getElementById('currentCover');
    const coverUrl = await resolveAssetUrl(track.cover);
    if (renderVersion !== playerRenderVersion) return;
    if (coverUrl) {
      cover.src = coverUrl;
      cover.addEventListener('error', () => cover.classList.add('is-hidden'), { once: true });
    } else {
      cover.classList.add('is-hidden');
    }

    setStaticPlayerIcons();
    await initPlayer(track, renderVersion);
  }

  function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${String(sec).padStart(2, '0')}`;
  }

  const PLAYER_ICONS = {
    prev: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5l-10 7 10 7V5z" fill="currentColor" stroke="none"/></svg>`,
    next: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7V5z" fill="currentColor" stroke="none"/></svg>`,
    play: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7V5z" fill="currentColor" stroke="none"/></svg>`,
    pause: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>`,
    volume: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15 9a4 4 0 010 6M17.8 6.8a7.5 7.5 0 010 10.4"/></svg>`,
    muted: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M16 9l5 6M21 9l-5 6"/></svg>`
  };

  function setStaticPlayerIcons() {
    const prev = document.getElementById('prevIcon');
    const next = document.getElementById('nextIcon');
    if (prev) prev.innerHTML = PLAYER_ICONS.prev;
    if (next) next.innerHTML = PLAYER_ICONS.next;
  }

  function setPlayIcon(isPlaying) {
    const icon = document.getElementById('playPauseIcon');
    if (icon) icon.innerHTML = isPlaying ? PLAYER_ICONS.pause : PLAYER_ICONS.play;
  }

  function renderVolumeIcon(volume) {
    const icon = document.getElementById('volumeIcon');
    if (icon) icon.innerHTML = volume <= 0 ? PLAYER_ICONS.muted : PLAYER_ICONS.volume;
  }

  async function initPlayer(track, renderVersion) {
    const audioUrl = await resolveAssetUrl(track.url);
    if (!audioUrl || renderVersion !== playerRenderVersion) return;

    audio = new Audio(audioUrl);
    audio.preload = 'metadata';
    audio.volume = Math.min(MAX_VOLUME, Math.max(0, currentVolume));

    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');

    let isPlaying = false;
    setPlayIcon(false);
    renderVolumeIcon(audio.volume);

    audio.addEventListener('timeupdate', () => {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      progressFill.style.width = `${Math.min(100, (audio.currentTime / audio.duration) * 100)}%`;
      currentTimeSpan.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationSpan.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('play', () => {
      isPlaying = true;
      setPlayIcon(true);
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      setPlayIcon(false);
    });

    audio.addEventListener('error', () => {
      isPlaying = false;
      setPlayIcon(false);
      durationSpan.textContent = 'Ошибка';
    });

    audio.addEventListener('ended', () => {
      currentTrackIndex = profile.audioShuffle
        ? chooseRandomTrackIndex()
        : (currentTrackIndex + 1) % playlist.length;
      renderAudioPlayer();
    });

    playPauseBtn?.addEventListener('click', async () => {
      if (isPlaying) {
        audio.pause();
        return;
      }
      try {
        await audio.play();
      } catch (error) {
        console.warn('Браузер не разрешил воспроизведение аудио.', error);
        setPlayIcon(false);
      }
    });

    prevBtn?.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      renderAudioPlayer();
    });

    nextBtn?.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
      renderAudioPlayer();
    });

    volumeSlider?.addEventListener('input', () => {
      currentVolume = Math.min(MAX_VOLUME, Math.max(0, Number(volumeSlider.value) || 0));
      if (currentVolume > 0) lastNonZeroVolume = currentVolume;
      audio.volume = currentVolume;
      renderVolumeIcon(audio.volume);
    });

    volumeBtn?.addEventListener('click', () => {
      if (audio.volume > 0) {
        lastNonZeroVolume = audio.volume;
        currentVolume = 0;
      } else {
        currentVolume = lastNonZeroVolume || 0.5;
      }
      audio.volume = currentVolume;
      if (volumeSlider) volumeSlider.value = String(currentVolume);
      renderVolumeIcon(audio.volume);
    });

    const seek = (clientX) => {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      const rect = progressBar.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
    };

    progressBar?.addEventListener('click', (event) => seek(event.clientX));
    progressBar?.addEventListener('keydown', (event) => {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        const delta = event.key === 'ArrowLeft' ? -5 : 5;
        audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + delta));
      }
    });
  }

  window.addEventListener('beforeunload', () => {
    for (const url of runtimeAssetUrls.values()) URL.revokeObjectURL(url);
    runtimeAssetUrls.clear();
  });

  window.addEventListener('storage', (event) => {
    if (event.key !== PROFILE_KEY && event.key !== PROFILE_DEFAULT_KEY) return;
    loadPublishedProfile().then(async (published) => {
      profile = loadLocalProfile(published);
      await applyProfile();
      rebuildPlayerFromProfile();
    });
  });

  (async function init() {
    const published = await loadPublishedProfile();
    profile = loadLocalProfile(published);
    await applyProfile();
    rebuildPlayerFromProfile();
  })();
</script>
</body>
</html>
