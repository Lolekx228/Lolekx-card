<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lolekx's Card Настройки</title>

  <!-- Иконка вкладки (favicon) -->
  <link rel="icon" type="image/png" href="https://r2.guns.lol/a90d9caf-a563-4b08-a030-1febdba3397e.webp">

  <!-- Бегущая строка в заголовке вкладки -->
  <script>
    (function () {
      let baseTitle = document.title || "Lolekx's Card Настройки";
      const separator = " • ";
      const speed = 250;

      let scrollTitle = baseTitle + separator;
      let pos = 0;

      function tick() {
        const len = scrollTitle.length;
        const view = scrollTitle.slice(pos) + scrollTitle.slice(0, pos);
        document.title = view;
        pos = (pos + 1) % len;
        setTimeout(tick, speed);
      }

      if (document.readyState === "complete" || document.readyState === "interactive") {
        tick();
      } else {
        document.addEventListener("DOMContentLoaded", tick);
      }
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Onest', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #080808;
      padding: 20px;
      animation: fadeIn 0.5s ease;
      color: #ffffff;
      gap: 10px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .background-blur {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(10px) brightness(0.7);
      z-index: -2;
    }

    .profile-card,
    .media-card {
      max-width: 520px;
      width: 100%;
    }

    .profile-card {
      border-radius: 20px;
      padding: 24px 20px 18px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      transition: box-shadow 0.2s ease;
      backdrop-filter: blur(8px);
      background: linear-gradient(25deg, rgba(111,0,0,0.7), rgba(147,56,0,0.7));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile-card:hover {
      box-shadow: 0 20px 44px rgba(0,0,0,0.6);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #5b5b5b;
      margin-bottom: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .username {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .description {
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.5;
      text-align: center;
    }

    .location-wrapper {
      display: flex;
      justify-content: center;
    }

    .location {
      font-size: 14px;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 3px 10px;
      border-radius: 999px;
      position: relative;
    }

    .location-icon {
      width: 14px;
      height: 14px;
      display: inline-block;
    }

    .location-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .location-text {
      display: inline-block;
      line-height: 1.2;
    }

    /* тултип с полным названием */
    .location-tooltip {
      position: absolute;
      left: 50%;
      bottom: 120%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
    }

    .location-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px;
      border-style: solid;
      border-color: rgba(0,0,0,0.85) transparent transparent transparent;
    }

    .location:hover .location-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .social-links a {
      background: rgba(0,0,0,0.55);
      padding: 7px 18px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: background 0.2s ease, border-color 0.2s ease;
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
    }

    .social-links a:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.26);
    }

    .icon {
      width: 18px;
      height: 18px;
      display: inline-block;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .media-card {
      border-radius: 20px;
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      background: linear-gradient(25deg, rgba(111,0,0,0.7), rgba(147,56,0,0.7));
    }

    .audio-player-card {
      background: rgba(0,0,0,0.65);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .audio-cover {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
    }

    .audio-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .audio-info { flex: 1; min-width: 160px; }

    .audio-title {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 11px;
      opacity: 0.8;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 3px;
      transition: width 0.05s linear;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.9;
      transition: background 0.1s ease, opacity 0.1s ease;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      opacity: 1;
      background: rgba(255,255,255,0.16);
    }

    .play-btn {
      background: #ffffff;
      color: #000000;
      width: 32px;
      height: 32px;
      font-size: 14px;
      border-radius: 50%;
    }

    .play-btn:hover {
      background: #e0e0e0;
    }

    .volume-slider {
      width: 70px;
      height: 3px;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body { justify-content: flex-start; }
      .profile-card { padding: 20px 14px 16px; }
      .username { font-size: 26px; }
      .description { font-size: 14px; }
      .avatar { width: 90px; height: 90px; }
      .social-links a { padding: 6px 14px; font-size: 13px; }
      .audio-player-card {
        flex-direction: column;
        text-align: center;
      }
      .audio-cover { width: 80px; height: 80px; }
      .audio-controls { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="background-blur" id="bgBlur"></div>

<div class="profile-card" id="profileCard">
  <img class="avatar" id="avatar" src="" alt="Avatar">
  <h1 class="username" id="username"></h1>
  <p class="description" id="description"></p>

  <div class="location-wrapper">
    <div class="location" id="location">
      <span class="location-icon">
        <svg viewBox="4 2 16 20" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor"
                d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 10q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22">
          </path>
        </svg>
      </span>
      <span class="location-text"></span>
      <span class="location-tooltip" id="locationTooltip"></span>

  <div class="social-links" id="socialLinks"></div>

<div class="media-card">
  <div id="audioPlayerContainer"></div>
</div>

<script>
  const PROFILE_KEY = 'Lolekx228_profile';
  const PROFILE_DEFAULT_KEY = 'Lolekx228_profile_default';

  const defaultProfile = {
    displayName: "Lolekx228",
    description: "Hiii Me: Animation artist, Voice actor, Programmer, Web Developer, Game Developer, 3D modeler",
    locationShort: "Україна, ДНР, Донецьк",
    locationFull: "Україна, Донецкая Народная Республика, город Донецьк",
    location: "Україна, ДНР, Донецьк",
    accentColor: "#5b5b5b",
    textColor: "#ffffff",
    bgColor: "#080808",
    gradientEnabled: true,
    gradient1: "#6f0000",
    gradient2: "#933800",
    backgroundEffect: "blurred",
    blur: 10,
    opacity: 0.9,
    monochrome: true,
    animatedTitle: true,
    audio: [
      { title: "Durnojj Vkus - Plastinki",
        url: "https://r2.guns.lol/e2040c07-063d-4f8d-bf4a-4a784e5cb3f2.mp3",
        cover: "https://r2.guns.lol/8b57c2d3-3cd2-4915-ad39-431819946a45.webp"
      },
      { title: "Kino - Spokojjnaya Noch",
        url: "https://r2.guns.lol/ef254576-8efc-4601-a39a-025acd7f50af.mp3",
        cover: "https://r2.guns.lol/998a3ed5-4b5d-41c0-bdbe-c3ce107fc6b0.webp"
      }
    ],
    socials: [
      { name: "youtube", url: "https://youtube.com/@Lolekx228" },
      { name: "discord", url: "https://discord.com/users/919815468519391252" }
    ],
    backgroundUrl: "https://r2.guns.lol/404eaec9-de84-4ca0-b031-6059b171072a.webp",
    avatarUrl: "https://r2.guns.lol/a90d9caf-a563-4b08-a030-1febdba3397e.webp"
  };

  function loadDefaultProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_DEFAULT_KEY);
      if (!raw) return defaultProfile;
      const parsed = JSON.parse(raw);
      return { ...defaultProfile, ...parsed };
    } catch {
      return defaultProfile;
    }
  }

  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (!raw) return loadDefaultProfile();
      const parsed = JSON.parse(raw);
      return { ...loadDefaultProfile(), ...parsed };
    } catch {
      return loadDefaultProfile();
    }
  }

  const profile = loadProfile();

  const bgBlur = document.getElementById('bgBlur');
  const profileCard = document.getElementById('profileCard');
  const avatar = document.getElementById('avatar');
  const usernameEl = document.getElementById('username');
  const descriptionEl = document.getElementById('description');
  const locationEl = document.getElementById('location');
  const locationTextEl = locationEl.querySelector('.location-text');
  const locationTooltipEl = document.getElementById('locationTooltip');
  const socialLinksEl = document.getElementById('socialLinks');

  function applyProfile() {
    if (profile.backgroundUrl) {
      bgBlur.style.backgroundImage = `url('${profile.backgroundUrl}')`;
    }

    if (profile.gradientEnabled) {
      const grad = `linear-gradient(25deg, ${profile.gradient1}, ${profile.gradient2})`;
      profileCard.style.background = grad;
      document.querySelector('.media-card').style.background = grad;
    } else {
      profileCard.style.background = profile.bgColor;
      document.querySelector('.media-card').style.background = profile.bgColor;
    }

    const blurValue = typeof profile.blur === 'number'
      ? profile.blur
      : (parseFloat(profile.blur) || 10);

    profileCard.style.backdropFilter = `blur(${Math.max(blurValue - 2, 0)}px)`;
    bgBlur.style.filter = `blur(${blurValue}px) brightness(0.7)`; // [web:110]

    profileCard.style.opacity = profile.opacity;

    usernameEl.textContent = profile.displayName;
    descriptionEl.textContent = profile.description;

    const locShort = profile.locationShort || profile.location || "";
    const locFull  = profile.locationFull || profile.location || locShort;

    locationTextEl.textContent = locShort;
    if (locationTooltipEl) {
      locationTooltipEl.textContent = locFull;
    }

    profileCard.style.color = profile.textColor;

    avatar.src = profile.avatarUrl;

    socialLinksEl.innerHTML = "";
    (profile.socials || []).forEach(s => {
      if (!s.url) return;
      const a = document.createElement('a');
      a.href = s.url;
      a.target = "_blank";

      const iconSpan = document.createElement('span');
      iconSpan.className = 'icon';

      if (s.name === 'youtube') {
        iconSpan.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="1.99 5 20.01 14.01">
            <path fill="currentColor"
                  d="M21.593 7.203a2.506 2.506 0 0 0-1.762-1.766C18.265 5.007 12 5 12 5s-6.264-.007-7.831.404a2.56 2.56 0 0 0-1.766 1.778c-.413 1.566-.417 4.814-.417 4.814s-.004 3.264.406 4.814c.23.857.905 1.534 1.763 1.765c1.582.43 7.83.437 7.83.437s6.265.007 7.831-.403a2.515 2.515 0 0 0 1.767-1.763c.414-1.565.417-4.812.417-4.812s.02-3.265-.407-4.831zM9.996 15.005l.005-6l5.207 3.005l-5.212 2.995z">
            </path>
          </svg>`;
        a.appendChild(iconSpan);
        a.appendChild(document.createTextNode('YouTube'));
      } else if (s.name === 'discord') {
        iconSpan.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="1.96 4.26 20.03 15.53">
            <path fill="currentColor"
                  d="M14.82 4.26a10.14 10.14 0 0 0-.53 1.1a14.66 14.66 0 0 0-4.58 0a10.14 10.14 0 0 0-.53-1.1a16 16 0 0 0-4.13 1.3a17.33 17.33 0 0 0-3 11.59a16.6 16.6 0 0 0 5.07 2.59A12.89 12.89 0 0 0 8.23 18a9.65 9.65 0 0 1-1.71-.83a3.39 3.39 0 0 0 .42-.33a11.66 11.66 0 0 0 10.12 0q.21.18.42.33a10.84 10.84 0 0 1-1.71.84a12.41 12.41 0 0 0 1.08 1.78a16.44 16.44 0 0 0 5.06-2.59a17.22 17.22 0 0 0-3-11.59a16.09 16.09 0 0 0-4.09-1.35zM8.68 14.81a1.94 1.94 0 0 1-1.8-2a1.93 1.93 0 0 1 1.8-2a1.93 1.93 0 0 1 1.8 2a1.93 1.93 0 0 1-1.8 2zm6.64 0a1.94 1.94 0 0 1-1.8-2a1.93 1.93 0 0 1 1.8-2a1.92 1.92 0 0 1 1.8 2a1.92 1.92 0 0 1-1.8 2z">
            </path>
          </svg>`;
        a.appendChild(iconSpan);
        a.appendChild(document.createTextNode('Discord'));
      } else {
        a.textContent = s.name || 'Link';
      }

      if (profile.monochrome) a.style.filter = "grayscale(1)";
      socialLinksEl.appendChild(a);
    });

    if (profile.animatedTitle) {
      usernameEl.style.animation = "glow 2s ease-in-out infinite alternate";
      const style = document.createElement('style');
      style.textContent = `
        @keyframes glow {
          from { text-shadow: 0 0 4px ${profile.accentColor}; }
          to { text-shadow: 0 0 14px ${profile.accentColor}; }
        }
      `;
      document.head.appendChild(style);
    }
  }

  applyProfile();

  const audioPlayerContainer = document.getElementById('audioPlayerContainer');
  const playlist = (profile.audio || []).map(track => ({
    title: track.title,
    url: track.url,
    cover: track.cover
  })).filter(t => t.url);

  let currentTrack = 0;

  const MAX_VOLUME = 1.0;
  let currentVolume = 0.5;

  let audio = null;

  function renderAudioPlayer() {
    if (!playlist.length) {
      audioPlayerContainer.innerHTML = "";
      return;
    }

    const track = playlist[currentTrack];
    audioPlayerContainer.innerHTML = `
      <div class="audio-player-card">
        <div class="audio-cover">
          <img id="currentCover" src="${track.cover || ""}" alt="cover"
            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\' fill=\\'white\\'%3E%3Cpath d=\\'M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\\'/%3E%3C/svg%3E'">
        </div>
        <div class="audio-info">
          <div class="audio-title" id="audioTitle">${track.title}</div>
          <div class="progress-container">
            <span class="current-time" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="duration" id="duration">0:00</span>
          </div>
          <div class="audio-controls">
            <button class="ctrl-btn" id="prevBtn" aria-label="Предыдущий трек">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24">
                <path fill="currentColor"
                      d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1m3.66 6.82l5.77 4.07c.66.47 1.58-.01 1.58-.82V7.93c0-.81-.91-1.28-1.58-.82l-5.77 4.07a1 1 0 0 0 0 1.64"/>
              </svg>
            </button>
            <button class="ctrl-btn play-btn" id="playPauseBtn"
                    aria-label="Воспроизведение/пауза">
              <svg id="playIcon" xmlns="http://www.w3.org/2000/svg"
                   width="18" height="18" viewBox="0 0 24 24">
                <path fill="currentColor"
                      d="M8 17.175V6.825q0-.425.3-.713t.7-.287q.125 0 .263.037t.262.113l8.15 5.175q.225.15.338.375t.112.475t-.112.475t-.338.375l-8.15 5.175q-.125.075-.262.113T9 18.175q-.4 0-.7-.288t-.3-.712"/>
              </svg>
            </button>
            <button class="ctrl-btn" id="nextBtn" aria-label="Следующий трек">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                   viewBox="0 0 24 24">
                <path fill="currentColor"
                      d="m7.58 16.89l5.77-4.07c.56-.4.56-1.24 0-1.63L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82M16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1"/>
              </svg>
            </button>
            <button class="ctrl-btn" id="volumeBtn" aria-label="Громкость">
              <span id="volumeIcon"></span>
            </button>
            <input type="range" id="volumeSlider" class="volume-slider"
                   min="0" max="${MAX_VOLUME}" step="0.01" value="${currentVolume}">
          </div>
        </div>
      </div>
    `;
    initPlayer();
  }

  function renderVolumeIcon(vol) {
    const iconSpan = document.getElementById('volumeIcon');
    if (!iconSpan) return;
    if (vol === 0) {
      iconSpan.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24">
          <path fill="currentColor"
                d="m19 13.6l1.4 1.4L18.8 16.6L20.2 18L18.8 19.4L17.4 18l-1.4 1.4l-1.4-1.4L16 16.6l-1.4-1.6l1.4-1.4l1.4 1.4l1.6-1.4ZM4 9h4l4-4v14l-4-4H4Z">
          </path>
        </svg>`;
    } else {
      iconSpan.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 48 48">
          <defs>
            <mask id="ipTVolumeNotice0">
              <g fill="none" stroke="#fff" stroke-width="4">
                <path fill="#555" stroke-linejoin="round"
                      d="M24 6v36c-7 0-12.201-9.16-12.201-9.16H6a2 2 0 0 1-2-2V17.01a2 2 0 0 1 2-2h5.799S17 6 24 6Z"></path>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M32 15a11.91 11.91 0 0 1 1.684 1.859A12.07 12.07 0 0 1 36 24c0 2.654-.846 5.107-2.278 7.09A11.936 11.936 0 0 1 32 33"></path>
                <path stroke-linecap="round"
                      d="M34.236 41.186C40.084 37.696 44 31.305 44 24c0-7.192-3.796-13.496-9.493-17.02"></path>
              </g>
            </mask>
          </defs>
          <path fill="currentColor" d="M0 0h48v48H0z" mask="url(#ipTVolumeNotice0)"></path>
        </svg>`;
    }
  }

  function setPlayIcon(isPlaying) {
    const btn = document.getElementById('playPauseBtn');
    if (!btn) return;
    if (isPlaying) {
      btn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24">
          <path fill="currentColor"
                d="M8 5h3v14H8V5zm5 0h3v14h-3V5z"></path>
        </svg>`;
    } else {
      btn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
             viewBox="0 0 24 24">
          <path fill="currentColor"
                d="M8 17.175V6.825q0-.425.3-.713t.7-.287q.125 0 .263.037t.262.113l8.15 5.175q.225.15.338.375t.112.475t-.112.475t-.338.375l-8.15 5.175q-.125.075-.262.113T9 18.175q-.4 0-.7-.288t-.3-.712"/>
        </svg>`;
    }
  }

  function initPlayer() {
    if (audio) audio.pause();

    const track = playlist[currentTrack];
    audio = new Audio(track.url);
    audio.volume = currentVolume;

    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');

    let isPlaying = false;

    renderVolumeIcon(audio.volume);
    setPlayIcon(false);

    function updateProgress() {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      if (progressFill) progressFill.style.width = percent + '%';

      const curMin = Math.floor(audio.currentTime / 60);
      const curSec = Math.floor(audio.currentTime % 60);
      if (currentTimeSpan) {
        currentTimeSpan.textContent =
          curMin + ":" + (curSec < 10 ? "0" + curSec : curSec);
      }
    }

    audio.addEventListener('timeupdate', updateProgress);

    audio.addEventListener('loadedmetadata', () => {
      if (!audio.duration) return;
      const durMin = Math.floor(audio.duration / 60);
      const durSec = Math.floor(audio.duration % 60);
      if (durationSpan) {
        durationSpan.textContent =
          durMin + ":" + (durSec < 10 ? "0" + durSec : durSec);
      }
    });

    audio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % playlist.length;
      renderAudioPlayer();
    });

    if (playPauseBtn) {
      playPauseBtn.addEventListener('click', () => {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        } else {
          audio.play();
          isPlaying = true;
        }
        setPlayIcon(isPlaying);
      });
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
        renderAudioPlayer();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        currentTrack = (currentTrack + 1) % playlist.length;
        renderAudioPlayer();
      });
    }

    if (volumeSlider) {
      volumeSlider.addEventListener('input', () => {
        currentVolume = parseFloat(volumeSlider.value);
        audio.volume = currentVolume;
        renderVolumeIcon(audio.volume);
      });
    }

    if (volumeBtn) {
      volumeBtn.addEventListener('click', () => {
        if (audio.volume > 0) {
          currentVolume = 0;
          audio.volume = 0;
          volumeSlider.value = 0;
        } else {
          currentVolume = 0.5;
          audio.volume = currentVolume;
          volumeSlider.value = currentVolume;
        }
        renderVolumeIcon(audio.volume);
      });
    }

    if (progressBar) {
      progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        audio.currentTime = percent * audio.duration;
      });
    }
  }

  renderAudioPlayer();
</script>
</body>
</html>
