<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>@Lolekx228 | Profile Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Onest', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #080808; color: #fff; padding: 20px; gap: 15px; }
    .bg { position: fixed; inset: 0; background-size: cover; background-position: center; filter: blur(10px) brightness(0.6); z-index: -1; }
    .card { width: 100%; max-width: 450px; padding: 30px; border-radius: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .avatar { width: 130px; height: 130px; border-radius: 50%; border: 3px solid #444; object-fit: cover; margin-bottom: 15px; }
    .name { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
    .desc { opacity: 0.8; line-height: 1.6; margin-bottom: 20px; }
    .links a { display: block; margin: 10px 0; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; text-decoration: none; color: white; transition: 0.3s; }
    .links a:hover { background: rgba(255,255,255,0.15); }
    .player { margin-top: 20px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; }
    .cover { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="card" id="card">
    <img id="avatar" class="avatar">
    <h1 id="name" class="name"></h1>
    <p id="desc" class="desc"></p>
    <div id="links" class="links"></div>
    <div class="player" id="player"></div>
  </div>

<script>
  const p = JSON.parse(localStorage.getItem('Lolekx228_profile'));
  document.getElementById('name').textContent = p.displayName;
  document.getElementById('desc').textContent = p.description;
  document.getElementById('avatar').src = p.avatarUrl;
  document.getElementById('bg').style.backgroundImage = `url('${p.backgroundUrl}')`;
  document.getElementById('card').style.background = p.gradientEnabled ? `linear-gradient(25deg, ${p.gradient1}, ${p.gradient2})` : p.bgColor;
  
  p.socials.forEach(s => {
    document.getElementById('links').innerHTML += `<a href="${s.url}">${s.name.toUpperCase()}</a>`;
  });

  let cur = 0;
  let audio = new Audio();
  audio.volume = 0.5;

  function loadTrack() {
    audio.src = p.audio[cur].url;
    document.getElementById('player').innerHTML = `
      <img src="${p.audio[cur].cover}" class="cover">
      <div style="flex-grow:1; font-size:12px;">${p.audio[cur].title}</div>
      <button onclick="audio.paused ? audio.play() : audio.pause()">▶️</button>
      <button onclick="cur=(cur+1)%p.audio.length; loadTrack(); audio.play()">⏭</button>
    `;
  }
  loadTrack();
  document.body.onclick = () => audio.play();
</script>
</body>
</html>
