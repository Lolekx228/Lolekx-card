<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@Lolekx228 | Profile Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Onest', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #080808;
      padding: 20px;
      animation: fadeIn 0.5s ease;
      color: #ffffff;
      gap: 10px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .background-blur {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(5px) brightness(0.7);
      z-index: -2;
    }

    .profile-card,
    .media-card {
      max-width: 520px;
      width: 100%;
    }

    .profile-card {
      border-radius: 20px;
      padding: 24px 20px 18px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.12);
      transition: box-shadow 0.2s ease;
      backdrop-filter: blur(6px);
      background: linear-gradient(25deg, rgba(111,0,0,0.7), rgba(147,56,0,0.7));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile-card:hover {
      box-shadow: 0 20px 44px rgba(0,0,0,0.6);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #5b5b5b;
      margin-bottom: 10px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .username {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .description {
      font-size: 16px;
      opacity: 0.9;
      line-height: 1.5;
      text-align: center;
    }

    .location-wrapper {
      display: flex;
      justify-content: center;
    }

    .location {
      font-size: 14px;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .location-icon {
      width: 14px;
      height: 14px;
      display: inline-block;
    }

    .location-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .location-text {
      display: inline-block;
      line-height: 1.2;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .social-links a {
      background: rgba(0,0,0,0.55);
      padding: 7px 18px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: background 0.2s ease, border-color 0.2s ease;
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
    }

    .social-links a:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.26);
    }

    .icon {
      width: 16px;
      height: 16px;
      display: inline-block;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .media-card {
      border-radius: 20px;
      padding: 12px 10px;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      background: linear-gradient(25deg, rgba(111,0,0,0.7), rgba(147,56,0,0.7));
    }

    .audio-player-card {
      background: rgba(0,0,0,0.65);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .audio-cover {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
    }

    .audio-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .audio-info { flex: 1; min-width: 160px; }

    .audio-title {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 11px;
      opacity: 0.8;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 3px;
      transition: width 0.05s linear;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      opacity: 0.8;
      transition: background 0.1s ease, opacity 0.1s ease;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover {
      opacity: 1;
      background: rgba(255,255,255,0.12);
    }

    .play-btn {
      background: #ffffff;
      color: #000000;
      width: 32px;
      height: 32px;
      font-size: 14px;
      border-radius: 50%;
    }

    .play-btn:hover {
      background: #e0e0e0;
    }

    .volume-slider {
      width: 70px;
      height: 3px;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body { justify-content: flex-start; }
      .profile-card { padding: 20px 14px 16px; }
      .username { font-size: 26px; }
      .description { font-size: 14px; }
      .avatar { width: 90px; height: 90px; }
      .social-links a { padding: 6px 14px; font-size: 13px; }
      .audio-player-card {
        flex-direction: column;
        text-align: center;
      }
      .audio-cover { width: 80px; height: 80px; }
      .audio-controls { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="background-blur" id="bgBlur"></div>

<div class="profile-card" id="profileCard">
  <img class="avatar" id="avatar" src="" alt="Avatar">
  <h1 class="username" id="username"></h1>
  <p class="description" id="description"></p>

  <div class="location-wrapper">
    <div class="location" id="location">
      <span class="location-icon">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C8.7 2 6 4.7 6 8c0 4.1 4.4 8.9 5.7 10.3.2.2.4.3.6.3s.4-.1.6-.3C13.6 16.9 18 12.1 18 8c0-3.3-2.7-6-6-6zm0 8.5c-1.4 0-2.5-1.1-2.5-2.5S10.6 5.5 12 5.5s2.5 1.1 2.5 2.5S13.4 10.5 12 10.5z"/>
        </svg>
      </span>
      <span class="location-text"></span>
    </div>
  </div>

  <div class="social-links" id="socialLinks"></div>
</div>

<div class="media-card">
  <div id="audioPlayerContainer"></div>
</div>

<script>
  const PROFILE_KEY = 'Lolekx228_profile';

  const defaultProfile = {
    displayName: "Lolekx228",
    description: "Hiii Me: Animation artist, Voice actor, Programmer, Web Developer, Game Developer, 3D modeler",
    location: "Україна, ДНР, Донецьк",
    accentColor: "#5b5b5b",
    textColor: "#ffffff",
    bgColor: "#080808",
    gradientEnabled: true,
    gradient1: "#6f0000",
    gradient2: "#933800",
    backgroundEffect: "blurred",
    blur: 10,
    opacity: 0.9,
    monochrome: true,
    animatedTitle: true,
    audio: [
      { title: "Durnojj Vkus - Plastinki",
        url: "https://r2.guns.lol/e2040c07-063d-4f8d-bf4a-4a784e5cb3f2.mp3",
        cover: "https://r2.guns.lol/8b57c2d3-3cd2-4915-ad39-431819946a45.webp"
      },
      { title: "Kino - Spokojjnaya Noch",
        url: "https://r2.guns.lol/ef254576-8efc-4601-a39a-025acd7f50af.mp3",
        cover: "https://r2.guns.lol/998a3ed5-4b5d-41c0-bdbe-c3ce107fc6b0.webp"
      }
    ],
    socials: [
      { name: "youtube", url: "https://youtube.com/@Lolekx228" },
      { name: "discord", url: "https://discord.com/users/919815468519391252" }
    ],
    backgroundUrl: "https://r2.guns.lol/404eaec9-de84-4ca0-b031-6059b171072a.webp",
    avatarUrl: "https://r2.guns.lol/a90d9caf-a563-4b08-a030-1febdba3397e.webp"
  };

  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (!raw) return defaultProfile;
      const parsed = JSON.parse(raw);
      return { ...defaultProfile, ...parsed };
    } catch {
      return defaultProfile;
    }
  }

  const profile = loadProfile();

  const bgBlur = document.getElementById('bgBlur');
  const profileCard = document.getElementById('profileCard');
  const avatar = document.getElementById('avatar');
  const usernameEl = document.getElementById('username');
  const descriptionEl = document.getElementById('description');
  const locationEl = document.getElementById('location');
  const locationTextEl = locationEl.querySelector('.location-text');
  const socialLinksEl = document.getElementById('socialLinks');

  function applyProfile() {
    if (profile.backgroundUrl) {
      bgBlur.style.backgroundImage = `url('${profile.backgroundUrl}')`;
    }

    if (profile.gradientEnabled) {
      const grad = `linear-gradient(25deg, ${profile.gradient1}, ${profile.gradient2})`;
      profileCard.style.background = grad;
      document.querySelector('.media-card').style.background = grad;
    } else {
      profileCard.style.background = profile.bgColor;
      document.querySelector('.media-card').style.background = profile.bgColor;
    }

    profileCard.style.opacity = profile.opacity;
    profileCard.style.backdropFilter = `blur(${Math.max(profile.blur - 2, 0)}px)`;

    usernameEl.textContent = profile.displayName;
    descriptionEl.textContent = profile.description;
    locationTextEl.textContent = profile.location;
    profileCard.style.color = profile.textColor;

    avatar.src = profile.avatarUrl;

    socialLinksEl.innerHTML = "";
    (profile.socials || []).forEach(s => {
      if (!s.url) return;
      const a = document.createElement('a');
      a.href = s.url;
      a.target = "_blank";

      const iconSpan = document.createElement('span');
      iconSpan.className = 'icon';

      if (s.name === 'youtube') {
        iconSpan.innerHTML = `
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M23 7.2s-.2-1.6-.8-2.3c-.7-.8-1.5-.8-1.9-.9C17.9 3.7 12 3.7 12 3.7s-5.9 0-8.3.3c-.4.1-1.2.1-1.9.9C1.2 5.6 1 7.2 1 7.2S.8 9.1.8 11v1.9c0 1.9.2 3.8.2 3.8s.2 1.6.8 2.3c.7.8 1.6.8 2 0.9C6.5 19.9 12 20 12 20s5.9 0 8.3-.3c.4-.1 1.2-.1 1.9-.9.6-.8.8-2.3.8-2.3s.2-1.9.2-3.8V11c0-1.9-.2-3.8-.2-3.8zM9.8 14.8V8.6l5.4 3.1-5.4 3.1z"/>
          </svg>`;
        a.appendChild(iconSpan);
        a.appendChild(document.createTextNode('YouTube'));
      } else if (s.name === 'discord') {
        iconSpan.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M13.545 2.907a13.2 13.2 0 0 0-3.257-1.011.05.05 0 0 0-.052.025 8 8 0 0 0-.406.833 12.2 12.2 0 0 0-3.658 0 8 8 0 0 0-.412-.833.05.05 0 0 0-.052-.025 13.2 13.2 0 0 0-3.257 1.011.04.04 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032a.05.05 0 0 0 .021.037 13.3 13.3 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019 9 9 0 0 0 .818-1.329.05.05 0 0 0-.01-.059l-.018-.011c-.448-.168-.87-.38-1.248-.595a.05.05 0 0 1-.02-.066l.015-.019q.127-.095.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.05.05 0 0 1 .053.007q.121.1.248.195a.05.05 0 0 1-.004.085 8 8 0 0 1-1.249.594.05.05 0 0 0-.03.03.05.05 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.2 13.2 0 0 0 4.001-2.02.05.05 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.03.03 0 0 0-.02-.019M6.337 10.215c-.789 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612m5.316 0c-.788 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612"/>
          </svg>`;
        a.appendChild(iconSpan);
        a.appendChild(document.createTextNode('Discord'));
      } else {
        a.textContent = s.name || 'Link';
      }

      if (profile.monochrome) a.style.filter = "grayscale(1)";
      socialLinksEl.appendChild(a);
    });

    if (profile.animatedTitle) {
      usernameEl.style.animation = "glow 2s ease-in-out infinite alternate";
      const style = document.createElement('style');
      style.textContent = `
        @keyframes glow {
          from { text-shadow: 0 0 4px ${profile.accentColor}; }
          to { text-shadow: 0 0 14px ${profile.accentColor}; }
        }
      `;
      document.head.appendChild(style);
    }
  }

  applyProfile();

  const audioPlayerContainer = document.getElementById('audioPlayerContainer');
  const playlist = (profile.audio || []).map(track => ({
    title: track.title,
    url: track.url,
    cover: track.cover
  })).filter(t => t.url);

  let currentTrack = 0;

  // громкость 50%
  const MAX_VOLUME = 1.0;
  let currentVolume = 0.5;

  let audio = null;

  function renderAudioPlayer() {
    if (!playlist.length) {
      audioPlayerContainer.innerHTML = "";
      return;
    }

    const track = playlist[currentTrack];
    audioPlayerContainer.innerHTML = `
      <div class="audio-player-card">
        <div class="audio-cover">
          <img id="currentCover" src="${track.cover || ""}" alt="cover"
            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\' fill=\\'white\\'%3E%3Cpath d=\\'M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z\\'/%3E%3C/svg%3E'">
        </div>
        <div class="audio-info">
          <div class="audio-title" id="audioTitle">${track.title}</div>
          <div class="progress-container">
            <span class="current-time" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="duration" id="duration">0:00</span>
          </div>
          <div class="audio-controls">
            <button class="ctrl-btn" id="prevBtn">&#9664;&#9664;</button>
            <button class="ctrl-btn play-btn" id="playPauseBtn">&#9654;</button>
            <button class="ctrl-btn" id="nextBtn">&#9654;&#9654;</button>
            <button class="ctrl-btn" id="volumeBtn">
              <span id="volumeIcon">&#128266;</span>
            </button>
            <input type="range" id="volumeSlider" class="volume-slider"
                   min="0" max="${MAX_VOLUME}" step="0.01" value="${currentVolume}">
          </div>
        </div>
      </div>
    `;
    initPlayer();
  }

  function initPlayer() {
    if (audio) audio.pause();

    const track = playlist[currentTrack];
    audio = new Audio(track.url);
    audio.volume = currentVolume;

    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeIcon = document.getElementById('volumeIcon');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');

    let isPlaying = false;

    function updateVolumeIcon() {
      if (audio.volume === 0) volumeIcon.textContent = '🔇';
      else if (audio.volume < MAX_VOLUME / 2) volumeIcon.textContent = '🔉';
      else volumeIcon.textContent = '🔊';
    }

    updateVolumeIcon();

    function updateProgress() {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      if (progressFill) progressFill.style.width = percent + '%';

      const curMin = Math.floor(audio.currentTime / 60);
      const curSec = Math.floor(audio.currentTime % 60);
      if (currentTimeSpan) {
        currentTimeSpan.textContent =
          curMin + ":" + (curSec < 10 ? "0" + curSec : curSec);
      }
    }

    audio.addEventListener('timeupdate', updateProgress);

    audio.addEventListener('loadedmetadata', () => {
      const durMin = Math.floor(audio.duration / 60);
      const durSec = Math.floor(audio.duration % 60);
      if (durationSpan) {
        durationSpan.textContent =
          durMin + ":" + (durSec < 10 ? "0" + durSec : durSec);
      }
    });

    audio.addEventListener('ended', () => {
      currentTrack = (currentTrack + 1) % playlist.length;
      renderAudioPlayer();
    });

    if (playPauseBtn) {
      playPauseBtn.addEventListener('click', () => {
        if (isPlaying) {
          audio.pause();
          playPauseBtn.innerHTML = '&#9654;';
        } else {
          audio.play();
          playPauseBtn.innerHTML = '&#10074;&#10074;';
        }
        isPlaying = !isPlaying;
      });
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
        renderAudioPlayer();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        currentTrack = (currentTrack + 1) % playlist.length;
        renderAudioPlayer();
      });
    }

    if (volumeSlider) {
      volumeSlider.addEventListener('input', () => {
        currentVolume = parseFloat(volumeSlider.value);
        audio.volume = currentVolume;
        updateVolumeIcon();
      });
    }

    if (volumeBtn) {
      volumeBtn.addEventListener('click', () => {
        if (audio.volume > 0) {
          currentVolume = 0;
          audio.volume = 0;
          volumeSlider.value = 0;
        } else {
          currentVolume = 0.5;
          audio.volume = currentVolume;
          volumeSlider.value = currentVolume;
        }
        updateVolumeIcon();
      });
    }

    if (progressBar) {
      progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        audio.currentTime = percent * audio.duration;
      });
    }

    // Автоплей сразу при инициализации
    audio.play().catch(() => {
      // Если браузер не разрешил — включим при первом клике
      document.body.addEventListener('click', () => {
        audio.play().catch(() => {});
      }, { once: true });
    });
  }

  renderAudioPlayer();
</script>
</body>
</html>
